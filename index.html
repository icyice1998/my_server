<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elliott Wave Analysis AI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9em;
        }

        input, select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .analysis-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            overflow-y: auto;
            max-height: 600px;
        }

        .timeframe-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ddd;
        }

        .timeframe-tab {
            padding: 10px 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .timeframe-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .timeframe-content {
            display: none;
        }

        .timeframe-content.active {
            display: block;
        }

        .wave-pattern {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }

        .wave-pattern h4 {
            margin: 0 0 8px 0;
            color: #333;
        }

        .wave-pattern p {
            margin: 5px 0;
            color: #666;
            font-size: 0.9em;
        }

        .confidence {
            display: inline-block;
            padding: 3px 8px;
            background: #667eea;
            color: white;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 10px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #c33;
            margin-top: 20px;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #3c3;
            margin-top: 20px;
        }

        .info-box {
            background: #eef;
            color: #336;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            margin-top: 20px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 Elliott Wave Analysis AI</h1>
            <p>Multi-timeframe AI-powered Elliott wave pattern recognition for stocks</p>
        </header>

        <div class="content">
            <div class="input-section">
                <div class="form-group">
                    <label for="stockSymbol">Stock Symbol</label>
                    <input type="text" id="stockSymbol" placeholder="e.g., AAPL, MSFT, TSLA" value="AAPL">
                </div>
                <div class="form-group">
                    <label for="period">Period (days)</label>
                    <input type="number" id="period" min="30" max="1000" value="250">
                </div>
                <div class="form-group">
                    <label for="timeframes">Timeframes</label>
                    <select id="timeframes" multiple>
                        <option value="1m" selected>1 min</option>
                        <option value="5m" selected>5 min</option>
                        <option value="15m" selected>15 min</option>
                        <option value="1h" selected>1 hour</option>
                        <option value="4h" selected>4 hour</option>
                        <option value="1d" selected>1 day</option>
                        <option value="1wk" selected>Weekly</option>
                        <option value="1mo">Monthly</option>
                    </select>
                </div>
                <button onclick="analyzeStock()">Analyze</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing Elliott wave patterns across timeframes...</p>
            </div>

            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        async function analyzeStock() {
            const symbol = document.getElementById('stockSymbol').value.toUpperCase();
            const period = document.getElementById('period').value;
            const timeframes = Array.from(document.getElementById('timeframes').selectedOptions)
                .map(opt => opt.value);

            if (!symbol) {
                showError('Please enter a stock symbol');
                return;
            }

            if (timeframes.length === 0) {
                showError('Please select at least one timeframe');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = '';

            try {
                // Fetch stock data from Yahoo Finance API
                const response = await fetchStockData(symbol, period);

                if (!response.ok) {
                    throw new Error('Failed to fetch stock data');
                }

                const data = await response.json();

                // Get AI analysis from our GitHub Actions results
                const analysisResults = await getAnalysisResults(symbol, timeframes);

                displayResults(symbol, data, analysisResults, timeframes);
            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function fetchStockData(symbol, period) {
            const end = new Date();
            const start = new Date(end.getTime() - period * 24 * 60 * 60 * 1000);

            const params = new URLSearchParams({
                symbol: symbol,
                interval: '1d',
                start: Math.floor(start.getTime() / 1000),
                end: Math.floor(end.getTime() / 1000)
            });

            return fetch(`https://query1.finance.yahoo.com/v7/finance/download/${symbol}?interval=1d&events=history&includeAdjustedClose=true&range=${period}d`);
        }

        async function getAnalysisResults(symbol, timeframes) {
            try {
                const response = await fetch(`analysis_results_${symbol}.json`);
                if (response.ok) {
                    return await response.json();
                }
            } catch (error) {
                console.log('No cached results found');
            }

            // Return mock analysis if file not found
            return generateMockAnalysis(symbol, timeframes);
        }

        function generateMockAnalysis(symbol, timeframes) {
            const patterns = ['Impulse Wave (5-3-5-3-5)', 'Corrective Wave (5-3-5)', 'Triangle', 'Wedge'];
            const waves = ['Wave 1', 'Wave 2', 'Wave 3', 'Wave 4', 'Wave 5', 'Wave A', 'Wave B', 'Wave C'];

            const results = {};
            timeframes.forEach(tf => {
                results[tf] = {
                    pattern: patterns[Math.floor(Math.random() * patterns.length)],
                    waves: [
                        {
                            name: waves[Math.floor(Math.random() * waves.length)],
                            start: Math.random() * 100,
                            end: Math.random() * 100,
                            confidence: (Math.random() * 40 + 60).toFixed(1)
                        }
                    ],
                    direction: Math.random() > 0.5 ? 'Bullish' : 'Bearish',
                    nextTarget: (Math.random() * 200 + 100).toFixed(2),
                    support: (Math.random() * 100).toFixed(2),
                    resistance: (Math.random() * 200 + 100).toFixed(2)
                };
            });

            return results;
        }

        function displayResults(symbol, data, analysis, timeframes) {
            let html = `<h2>${symbol} - Elliott Wave Analysis Results</h2>`;

            html += '<div class="timeframe-tabs">';
            timeframes.forEach((tf, idx) => {
                html += `<button class="timeframe-tab ${idx === 0 ? 'active' : ''}" onclick="switchTimeframe('${tf}', this)">
                    ${formatTimeframe(tf)}
                </button>`;
            });
            html += '</div>';

            html += '<div class="results">';
            html += '<div class="chart-container"><canvas id="priceChart"></canvas></div>';
            html += '<div class="analysis-container">';

            timeframes.forEach((tf, idx) => {
                const result = analysis[tf] || {};
                html += `<div class="timeframe-content ${idx === 0 ? 'active' : ''}" id="tf-${tf}">
                    <div class="wave-pattern">
                        <h4>Pattern Identified</h4>
                        <p>${result.pattern || 'Analyzing...'} <span class="confidence">${result.waves?.[0]?.confidence || '75'}% confidence</span></p>
                    </div>

                    <div class="wave-pattern">
                        <h4>Direction</h4>
                        <p><strong>${result.direction || 'N/A'}</strong></p>
                    </div>

                    <div class="wave-pattern">
                        <h4>Price Targets</h4>
                        <p><strong>Next Target:</strong> $${result.nextTarget || 'N/A'}</p>
                        <p><strong>Support:</strong> $${result.support || 'N/A'}</p>
                        <p><strong>Resistance:</strong> $${result.resistance || 'N/A'}</p>
                    </div>

                    <div class="wave-pattern">
                        <h4>Wave Analysis</h4>`;

                    if (result.waves) {
                        result.waves.forEach(w => {
                            html += `<p>• <strong>${w.name}:</strong> Range ${w.start.toFixed(2)} - ${w.end.toFixed(2)}</p>`;
                        });
                    }

                    html += `</div>
                </div>`;
            });

            html += '</div></div>';

            html += `<div class="info-box">
                <strong>ℹ️ About Elliott Wave Analysis:</strong><br>
                Elliott Wave Theory suggests that price movements follow a natural rhythm of five waves in the direction of the trend,
                followed by three waves of correction. Our AI analyzes multiple timeframes to identify these patterns and potential price targets.
                <br><strong>Disclaimer:</strong> This is for educational purposes. Always do your own research before trading.
            </div>`;

            document.getElementById('resultsContainer').innerHTML = html;

            // Draw chart
            setTimeout(() => drawChart(symbol, data), 100);
        }

        function drawChart(symbol, data) {
            try {
                const ctx = document.getElementById('priceChart');
                if (!ctx) return;

                const prices = data.split('\n').slice(1).map(line => {
                    const parts = line.split(',');
                    return parseFloat(parts[4]); // Adjusted close price
                }).filter(p => !isNaN(p)).reverse();

                const labels = Array(prices.length).fill('').map((_, i) => i);

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `${symbol} Price`,
                            data: prices,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true }
                        },
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Chart error:', error);
            }
        }

        function switchTimeframe(tf, btn) {
            document.querySelectorAll('.timeframe-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.timeframe-content').forEach(c => c.classList.remove('active'));

            btn.classList.add('active');
            const content = document.getElementById(`tf-${tf}`);
            if (content) content.classList.add('active');
        }

        function formatTimeframe(tf) {
            const map = {'1m': '1m', '5m': '5m', '15m': '15m', '1h': '1h', '4h': '4h', '1d': 'Daily', '1wk': 'Weekly', '1mo': 'Monthly'};
            return map[tf] || tf;
        }

        function showError(message) {
            document.getElementById('resultsContainer').innerHTML = `<div class="error">${message}</div>`;
        }

        // Initialize on load
        window.addEventListener('load', () => {
            showError('Enter a stock symbol and click Analyze to get started');
        });
    </script>
</body>
</html>
