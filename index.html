<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<script>
  // Links from before the Market Analyzer moved into /market/ keep working.
  (() => {
    const q = new URLSearchParams(location.search).get("symbol");
    const h = location.hash;
    if (q) location.replace(`market/?symbol=${encodeURIComponent(q)}`);
    else if (/^#(overview|screener|asset)/.test(h)) location.replace(`market/${h}`);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f2f2ef; --surface-1: #fcfcfb; --border: #e0ded7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7872; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #33322f;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8d85; --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #33322f;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8d85; --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--text-muted); margin: 0 0 24px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; }
  a.card:hover { border-color: var(--accent); }
  a.card h2 { font-size: 17px; margin: 0 0 6px; color: var(--accent); }
  a.card p { margin: 0; color: var(--text-secondary); }
  a.card .path { margin-top: 10px; font-size: 12px; color: var(--text-muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Projects</h1>
  <p class="sub">Each project lives in its own folder of this repository and is published under its own path.</p>
  <div class="grid" id="projects"></div>
</main>
<script>
  // One entry per project folder. A card is shown only when its page is published on this site.
  const PROJECTS = [
    { path: "market/", name: "Market Analyzer",
      desc: "Thai stocks, US stocks and funds: trend, accounts, Elliott Wave, Smart Money Concepts, forecasts and a 177-asset screener." },
    { path: "floodwatcher/", name: "Floodwatcher",
      desc: "Bangkok open-data flood map and dashboard." },
  ];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  Promise.all(PROJECTS.map(p => fetch(p.path, { method: "HEAD" }).then(r => r.ok ? p : null).catch(() => null)))
    .then(list => {
      document.getElementById("projects").innerHTML = list.filter(Boolean).map(p =>
        `<a class="card" href="${p.path}"><h2>${esc(p.name)}</h2><p>${esc(p.desc)}</p><div class="path">/${esc(p.path)}</div></a>`).join("");
    });
</script>
</body>
</html>
