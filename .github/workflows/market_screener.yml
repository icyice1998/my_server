name: Market Screener

# Refreshes everything the dashboard reads: the screener (with prediction-model scores) and the daily
# price files that the browser engine analyses (market/data/prices/*.json).
on:
  workflow_dispatch:
    inputs:
      universes:
        description: 'Universes to screen (comma-separated): TH, US, ETF or ALL'
        default: 'ALL'
  schedule:
    # Weekdays 11:40 UTC (18:40 Bangkok), after the SET close
    - cron: '40 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-analyzer
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screener and browser price data
        env:
          UNIVERSES: ${{ inputs.universes || 'ALL' }}
        run: python -m market_analyzer --screen "$UNIVERSES" --export-data data --model model/model.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add reports/screener.json data/
          git diff --cached --quiet && exit 0
          git commit -m "Update market screener and price data"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
