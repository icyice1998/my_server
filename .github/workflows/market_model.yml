name: Market Model

# Retrains the prediction model (market/model/model.json) on 10 years of the whole universe.
on:
  workflow_dispatch:
  schedule:
    # Sundays 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: write

concurrency:
  group: market-analyzer
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Train
        run: python -m market_analyzer --train model/model.json

      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add model/model.json
          git diff --cached --quiet && exit 0
          git commit -m "Retrain market prediction model"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
