name: Elliott Wave Analysis

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Stock symbol (e.g., AAPL, MSFT)'
        required: true
        default: 'AAPL'
      period:
        description: 'Period in days'
        required: false
        default: '250'
      timeframes:
        description: 'Timeframes (comma-separated): 1m,5m,15m,1h,4h,1d,1wk,1mo'
        required: false
        default: '1d,4h,1h'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Elliott Wave Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python elliott_wave_analyzer.py ${{ github.event.inputs.symbol }} $(echo "${{ github.event.inputs.timeframes }}" | tr ',' ' ')

      - name: Upload analysis results
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results
          path: analysis_results_*.json

      - name: Commit results to gh-pages
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Copy results
          if ls analysis_results_*.json 1> /dev/null 2>&1; then
            git add analysis_results_*.json
            git commit -m "Add Elliott Wave analysis for ${{ github.event.inputs.symbol }}" || true
            git push
          fi
