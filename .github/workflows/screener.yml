name: Screener

on:
  workflow_dispatch:
    inputs:
      universes:
        description: 'Universes to screen (comma-separated): TH, US, ETF or ALL'
        default: 'TH,US,ETF'
  issues:
    # Keyless trigger from the web page: an issue titled "screen: TH,US,ETF" by the repo owner
    types: [opened]
  schedule:
    # Weekdays 11:40 UTC (18:40 Bangkok), after the SET close and the watchlist run
    - cron: '40 11 * * 1-5'

permissions:
  contents: write
  issues: write

concurrency:
  group: market-analysis
  cancel-in-progress: false

jobs:
  screen:
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, 'screen:') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          INPUT: ${{ inputs.universes }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          U="${INPUT:-TH,US,ETF}"
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then U="${TITLE#screen:}"; U="${U// /}"; U="${U:-TH,US,ETF}"; fi
          python -m market_analyzer --screen "$U"

      - name: Commit screener results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add reports/screener.json
          git diff --cached --quiet && exit 0
          git commit -m "Update screener"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1

      - name: Reply on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#screener
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then MSG="Screener updated. The site refreshes in about a minute: $SITE"; else MSG="The screener run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
